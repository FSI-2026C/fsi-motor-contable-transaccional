name: QA - Regresión Nocturna y Prueba de Estrés Transaccional

on:
  schedule:
    # Todos los días a las 03:00 UTC (22:00 hora Perú)
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  regresion-y-estres:
    name: Regresión Completa y Estrés ACID (150+ Asientos)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar batería de regresión, precisión decimal y carga ACID
        run: python -m unittest tests/test_rendimiento_y_reglas_sunat.py tests/test_motor_contable.py tests/test_api_integracion.py -v

      - name: Publicar resumen de regresión nocturna
        run: |
          echo "## Regresión Nocturna QA — Aprobada" >> $GITHUB_STEP_SUMMARY
          echo "- Validación de 150 transacciones ACID consecutivas (< 10s)." >> $GITHUB_STEP_SUMMARY
          echo "- Precisión decimal IGV 18% y Rollback ante error SQL verificados." >> $GITHUB_STEP_SUMMARY
          echo "- Cuadre global Diario = Mayor = PLE 5.1 confirmado." >> $GITHUB_STEP_SUMMARY
